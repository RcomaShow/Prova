name: JaCoCo skill real benchmark

on:
  push:
    branches:
      - bench/jacoco-v014-v012-20260813
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAVEN_OPTS: -Xmx3g -XX:+UseG1GC
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Environment
        run: |
          java -version
          mvn -version
          python --version

      - name: Reconstruct benchmark skill sources
        run: |
          mkdir -p benchmark/sources
          cat benchmark/sources.b64.* | base64 --decode > benchmark/sources.tar.xz
          echo "Source archive reconstructed:"
          wc -c benchmark/sources.tar.xz
          sha256sum benchmark/sources.tar.xz
          xz -t benchmark/sources.tar.xz
          tar -xJf benchmark/sources.tar.xz -C benchmark/sources
          python -m py_compile benchmark/sources/v012/jacoco_skill/*.py
          python -m py_compile benchmark/sources/v014/jacoco_skill/*.py
          cat benchmark/run_benchmark.py.b64.* | base64 --decode > benchmark/run_benchmark.py
          echo "Benchmark runner reconstructed:"
          wc -c benchmark/run_benchmark.py
          sha256sum benchmark/run_benchmark.py
          chmod +x benchmark/run_benchmark.py
          python -m py_compile benchmark/run_benchmark.py

      - name: Run public repository benchmark
        run: python benchmark/run_benchmark.py

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-skill-real-benchmark
          path: |
            benchmark-results/**
          if-no-files-found: warn
          retention-days: 7
